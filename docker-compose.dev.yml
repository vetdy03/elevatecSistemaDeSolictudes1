# Desarrollo local (Windows/macOS):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   cd frontend && npm install && npm run dev     → http://localhost:5180 (hot reload)
#
# - Laravel lee ./backend en vivo (los cambios en PHP se ven al recargar).
# - MySQL usa la MISMA base de datos que el modo normal (DATA_PATH, por defecto ./data/mysql).
# - http://localhost:8080 sigue mostrando la copia compilada del frontend (se actualiza con --build web).

services:
  app:
    build:
      target: dev
    image: fincontrol-app:dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
    volumes:
      - ./backend:/var/www/html
      # vendor/ vive dentro de Docker: en Windows leerlo desde la carpeta compartida hace cada petición ~5 s más lenta.
      # Al cambiar composer.json: docker compose -f docker-compose.yml -f docker-compose.dev.yml exec app composer install
      - backend_vendor:/var/www/html/vendor

volumes:
  backend_vendor:
