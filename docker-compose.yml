# FinControl — Sistema de Solicitudes
# Uso: cp .env.example .env  →  editar valores  →  docker compose up -d --build

x-laravel-env: &laravel-env
  APP_NAME: FinControl
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Define APP_KEY en .env (ver README)}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${TZ:-America/La_Paz}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: es_ES
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-fincontrol}
  DB_USERNAME: ${DB_USERNAME:-fincontrol}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-480}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-FinControl2026!}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  TZ: ${TZ:-America/La_Paz}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: fincontrol-app:latest
    container_name: fincontrol-app
    restart: unless-stopped
    environment: *laravel-env
    volumes:
      - ${DATA_PATH:-./data}/storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: fincontrol-web:latest
    container_name: fincontrol-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-America/La_Paz}
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: fincontrol-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fincontrol}
      MYSQL_USER: ${DB_USERNAME:-fincontrol}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      TZ: ${TZ:-America/La_Paz}
    volumes:
      - ${DATA_PATH:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
